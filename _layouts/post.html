---
layout: default
---
<article class="wrap narrow article">
  <header>
    <p class="meta">
      {% if page.topic %}<span class="tag">{{ page.topic }}</span>{% endif %}
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y/%m/%d" }}</time>
    </p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  {% include cta.html %}
  <p class="back"><a href="{{ '/articles/' | relative_url }}">← 回到文章列表</a></p>
</article>
