---
layout: default
---
<article class="wrap narrow article">
  <header>
    <p class="meta">
      {% if page.topic %}<span class="tag">{{ page.topic }}</span>{% endif %}
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y/%m/%d" }}</time>
    </p>
    <h1>{{ page.title }}</h1>
    <p class="note">本篇已改寫並取得當事人同意，不含可辨識的個人細節。</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  {% include cta.html %}
  <p class="back"><a href="{{ '/cases/' | relative_url }}">← 回到個案心得</a></p>
</article>
